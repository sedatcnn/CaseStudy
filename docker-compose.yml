services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: kayra-sqlserver
    environment:
      SA_PASSWORD: "${SQL_PASSWORD}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd",
             "-S", "localhost", "-U", "sa", "-P", "${SQL_PASSWORD}",
             "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - kayra-network

  auth-service:
    build:
      context: .
      dockerfile: src/Services/AuthService/AuthService.API/AuthService.API/Dockerfile
    container_name: kayra-auth-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=AuthDb;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True;
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=KayraExport.AuthService
      - JwtSettings__Audience=KayraExport.Clients
      - JwtSettings__ExpiryMinutes=60
      - SeedAdmin__Email=${SEED_ADMIN_EMAIL}
      - SeedAdmin__Password=${SEED_ADMIN_PASSWORD}
    ports:
      - "5001:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - kayra-network

networks:
  kayra-network:
    driver: bridge

volumes:
  sqlserver_data: